# 当你在 tmux 中查看长文本（如日志文件）时，按 Ctrl + b + [ 会进入「复制模式」
# 以 ctrl + j 作为开始
#set -g prefix C-j
set -g mouse on
setw -g mode-keys vi

# without confirm
bind -r x kill-pane
bind -r & kill-window

# 新面板/窗口使用当前目录
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 将 j 绑定为切换到下一个 pane
bind j select-pane -D

# 将 k 绑定为切换到上一个 pane
bind k select-pane -U



# 自动保存间隔（单位：分钟）
#set -g @continuum-save-interval '15'

# 启用开机自动恢复
#set -g @continuum-restore 'on'

# 可选：允许恢复终端内容（如 Vim 会话）
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum 与 tmux-resurrect 由 install.sh 自动 clone 到 ~/.tmux/plugins
# 缺失时静默跳过，避免裸机首次 tmux 启动报错
if-shell '[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' \
    'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell '[ -f ~/.tmux/plugins/tmux-continuum/continuum.tmux ]' \
    'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'

