set -g mouse on
set -g pane-base-index 1

# without confirm
bind -r x kill-pane
bind -r & kill-window

# 连按两次 prefix (Ctrl+b Ctrl+b) 关闭当前 pane
bind C-b kill-pane

# prefix + Ctrl+z 放大/还原当前 pane（替代 prefix + z）
bind C-z resize-pane -Z

# 新面板/窗口使用当前目录
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 自动保存间隔（单位：分钟）
set -g @continuum-save-interval '15'

# 启用开机自动恢复
set -g @continuum-restore 'on'

# 可选：允许恢复终端内容（如 Vim 会话）
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum 与 tmux-resurrect 由 install.sh 自动 clone 到 ~/.tmux/plugins
# 缺失时静默跳过，避免裸机首次 tmux 启动报错
if-shell '[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' \
    'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell '[ -f ~/.tmux/plugins/tmux-continuum/continuum.tmux ]' \
    'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'


# tokyo-night 配色
set -g pane-border-style 'fg=#24283b'
set -g pane-active-border-style 'fg=#7aa2f0'

